name: vagyonado app tests

on:
  push:
    paths: ["apps/vagyonado/**", "engine/**", ".github/workflows/vagyonado-app-tests.yml"]
  pull_request:
    paths: ["apps/vagyonado/**", "engine/**", ".github/workflows/vagyonado-app-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vagyonado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ../../engine -e ".[dev]"
      - run: pytest -q
