{% extends "base.html" %}
{% block title %}Belépés{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Belépés</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>E-mail-cím <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></label>
    <label>Jelszó <input type="password" name="password" required autocomplete="current-password"></label>
    <button>Belépés</button>
  </form>
</section>
{% endblock %}
