# Hungarian wealth tax (vagyonadó), draft bill.
# Status: DRAFT. Published for public consultation by the Ministry of Finance
# on 2026-10-06; comments close 2026-10-14. Not passed by Parliament.
# See RESEARCH.md for sources, open questions, and what the engine does not model yet.
#
# Brackets are on NET WEALTH, not on the tax base. The draft defines the base
# as net wealth above HUF 1 billion, taxed at 1% on the first HUF 100 billion of
# the base and 1.5% above it. In net-wealth terms: 0% to 1bn, 1% to 101bn, 1.5% above.
- id: hu-vagyonado-individual
  version: 1
  status: draft
  jurisdiction: HU
  tax_type: wealth
  tax_year: 2026
  filing_status: individual   # each spouse is assessed separately, each with their own 1bn threshold
  effective_from: 2026-12-15  # reported entry into force of the act
  effective_to: 2026-12-31
  valuation_date: 2026-12-31
  filing_due: 2027-08-31
  brackets:
    - { up_to: "1000000000", rate: "0" }
    - { up_to: "101000000000", rate: "0.01" }
    - { up_to: null, rate: "0.015" }
  rounding: { quantum: "1", mode: half_up }
  source:
    citation: "Pénzügyminisztérium: törvényjavaslat a vagyonadóról, társadalmi egyeztetés (2026-10-06). Not read directly: details from Andersen, RSM, BDO, Infostart summaries."
    url: "https://kormany.hu/dokumentumtar/tarsadalmi-egyeztetes-a-vagyonadorol-szolo-torvenyjavaslatrol"
    retrieved: 2026-10-08
  notes:
    - "Draft bill under public consultation until 2026-10-14. Rates, threshold, and dates may change before or during the parliamentary vote."
    - "Whether the 100bn band edge applies to the tax base (as modeled, 101bn net wealth) or to net wealth (100bn) must be confirmed against the bill text. Summaries differ in wording."
    - "Rounding to whole forints is an assumption. Confirm against the bill and the Art. (2017. évi CL. törvény) rounding rules."
    - "Sources disagree on the start: some report first liability on the 2026-12-31 position, others say the tax applies from 2027-01-01."

# Version 2: adds the exemption limits and valuation parameters reported from
# the draft, and settles the band edge (an adviser's reading of the text says
# 1.5% applies to the base above 100bn, so net wealth above 101bn, as in v1).
- id: hu-vagyonado-individual
  version: 2
  supersedes: hu-vagyonado-individual@1
  status: draft
  jurisdiction: HU
  tax_type: wealth
  tax_year: 2026
  filing_status: individual   # each spouse and adult family member separately, each with their own 1bn threshold
  effective_from: 2026-12-15
  effective_to: 2026-12-31
  valuation_date: 2026-12-31
  filing_due: 2027-08-31
  brackets: &vagyonado_brackets
    - { up_to: "1000000000", rate: "0" }
    - { up_to: "101000000000", rate: "0.01" }
    - { up_to: null, rate: "0.015" }
  rounding: { quantum: "1", mode: half_up }
  parameters: &vagyonado_parameters
    # Exemption limits, per item (draft 2026-10-06, as summarized)
    personal_movable_exempt_up_to: "1000000"    # personal-use movables worth at most 1m each are left out
    art_jewelry_exempt_up_to: "3000000"         # art, collections, jewelry count only above 3m each
    car_exempt_up_to: "10000000"                # cars with a computed value of at most 10m are left out
    # Unlisted company shares: (equity + 2 x earning value) / 3 x ownership share
    capitalization_rate: "0.15"                 # earning value = average after-tax profit of the last 3 closed years / 0.15
    hidden_reserves_equity_over: "500000000"    # above this equity, add audited hidden reserves
    holding_participation_ratio: "0.9"          # participations at least 90% of assets: equity only, no earning value
    minority_small_below: "0.33"                # holding below 33%: 30% discount
    minority_small_discount: "0.30"
    minority_mid_up_to: "0.50"                  # holding from 33% to 50%: 25% discount
    minority_mid_discount: "0.25"
  source: &vagyonado_source
    citation: "Pénzügyminisztérium: törvényjavaslat a vagyonadóról, társadalmi egyeztetés (2026-10-06), 1. melléklet for the company formula. Not read directly: details from Andersen, BDO, RSM, mfor, Privátbankár, Klubrádió summaries."
    url: "https://kormany.hu/dokumentumtar/tarsadalmi-egyeztetes-a-vagyonadorol-szolo-torvenyjavaslatrol"
    retrieved: 2026-10-08
  notes:
    - "Draft bill under public consultation until 2026-10-14. Rates, threshold, exemptions, and dates may change before or during the parliamentary vote."
    - "Rounding to whole forints is an assumption. Confirm against the bill and the Art. (2017. évi CL. törvény) rounding rules."
    - "Sources disagree on the start: some report first liability on the 2026-12-31 position, others say the tax applies from 2027-01-01."
    - "Minority discount edges (exactly 33%, exactly 50%) are assumptions: 33% gets 25%, 50% gets 25%, above 50% none."
    - "Assets given to a minor child count in the parent's base unless inherited or earned by the child. Not modeled: put them in the parent's asset list."
    - "Foreign wealth taxes are not creditable; only local property-type taxes may be. Not modeled."
  notes_hu:
    - "Társadalmi egyeztetésen lévő törvénytervezet (2026. október 14-ig). A kulcsok, az értékhatár, a mentességek és a határidők a parlamenti elfogadásig változhatnak."
    - "Az adó egész forintra kerekítése feltételezés; a törvényjavaslat és az Art. (2017. évi CL. törvény) kerekítési szabályai alapján ellenőrizendő."
    - "A források eltérnek a kezdésről: egyesek szerint az első kötelezettség a 2026. december 31-i állapot után keletkezik, mások szerint az adó 2027. január 1-jétől él."
    - "A kisebbségi kedvezmény határai feltételezések: pontosan 33% és pontosan 50% esetén 25%, 50% felett nincs kedvezmény."
    - "A kiskorú gyermeknek juttatott vagyon a szülő adóalapjába tartozik, kivéve az örökölt vagy saját keresetből szerzett vagyont. Ezt a szülő vagyonelemei között kell felvenni."
    - "A külföldön fizetett vagyonadó nem számítható be, legfeljebb a helyi, ingatlanadó jellegű adók. Ezt a számítás nem kezeli."

# Trusts and private foundations (vagyonkezelési adóalany). Same threshold and
# rates as individuals, but linked structures (same or related settlors) share
# one 1bn threshold. Assess linked structures together with compute().
- id: hu-vagyonado-trust
  version: 1
  status: draft
  jurisdiction: HU
  tax_type: wealth
  tax_year: 2026
  filing_status: trust
  effective_from: 2026-12-15
  effective_to: 2026-12-31
  valuation_date: 2026-12-31
  filing_due: 2027-08-31
  brackets: *vagyonado_brackets
  rounding: { quantum: "1", mode: half_up }
  parameters: *vagyonado_parameters
  source: *vagyonado_source
  notes:
    - "Draft bill under public consultation until 2026-10-14."
    - "Linked trusts and foundations of the same or related settlors share one 1bn threshold: pass all their assets to one compute() call."
    - "A foreign structure becomes a Hungarian taxpayer if it is effectively managed from Hungary. Residency is the caller's call."
  notes_hu:
    - "Társadalmi egyeztetésen lévő törvénytervezet (2026. október 14-ig)."
    - "Az ugyanazon vagy egymással kapcsolatban álló vagyonrendelőkhöz tartozó vagyonkezelések és magánalapítványok együtt egyszer kapják meg az 1 milliárd forintos értékhatárt: ezért egy ügyfélként szerepelnek."
    - "A külföldön létrehozott konstrukció magyar adóalannyá válik, ha tényleges irányítása Magyarországról történik. Az illetőséget a tanácsadó állapítja meg."
